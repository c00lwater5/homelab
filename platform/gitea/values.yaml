gitea:
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: &host git.mukhtaar.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-tls-certificate
        hosts:
          - *host
  gitea:
    admin:
      existingSecret: gitea-admin-secret
    config:
      server:
        LANDING_PAGE: explore
        ROOT_URL: https://git.mukhtaar.org
        OFFLINE_MODE: true
      repository:
        DISABLED_REPO_UNITS: repo.wiki,repo.projects,repo.packages
        DISABLE_STARS: true
        DEFAULT_BRANCH: master
      # TODO it's not reading the username from Dex correctly for now, related issues:
      # https://github.com/go-gitea/gitea/issues/25725
      # https://github.com/go-gitea/gitea/issues/24957
      # oauth2_client:
      #   ENABLE_AUTO_REGISTRATION: true
      #   USERNAME: userid
      service.explore:
        DISABLE_USERS_PAGE: true
      actions:
        ENABLED: false
      webhook:
        ALLOWED_HOST_LIST: private
  # Everything runs on the single worker (node02), which runs out of CPU
  # requests well before real CPU. The chart's preset asks for 250m per pod
  # but these idle at well under 100m.
  postgresql-ha:
    postgresql:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 50Mi
        limits:
          cpu: 375m
          memory: 384Mi
          ephemeral-storage: 2Gi
    pgpool:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 50Mi
        limits:
          cpu: 375m
          memory: 384Mi
          ephemeral-storage: 2Gi
