elementweb:
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/target: "homelab-tunnel.mukhtaar.org"
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    hosts:
      - host: &frontend_host chat.mukhtaar.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: element-tls-certificate
        hosts:
          - *frontend_host
  config:
    default:
      base_url: https://matrix.mukhtaar.org
      server_name: mukhtaar.org

dendrite:
  dendrite_config:
    global:
      server_name: matrix.mukhtaar.org
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hostName: matrix.mukhtaar.org
    tls:
      - hosts:
          - matrix.mukhtaar.org
        secretName: matrix-tls-certificate
  postgresql:
    enabled: true
    image:
      # The dendrite chart's postgresql subchart pins an old tag that
      # Bitnami pruned in their 2025 registry change
      # (https://github.com/bitnami/containers/issues/83267). The free
      # docker.io/bitnami/postgresql repo now only publishes a floating
      # `latest` tag (no versioned tags), so pin by digest instead of
      # tag - otherwise a future pod recreation could silently pull a
      # different major version with no warning.
      #
      # This is PostgreSQL 18 (docker.io/bitnami/postgresql:latest
      # resolved to 18.6 as of 2026-09-19) - a clean upgrade from the
      # previous 15.1.0, since there was no existing matrix data to
      # migrate. Re-pin this digest when intentionally upgrading again.
      registry: docker.io
      repository: bitnami/postgresql
      tag: "18.6"
      digest: sha256:b74b23f091dcc87041bcae557d840c36458af46b955279cb13aedec4c32d7f71
